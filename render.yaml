services:
  - type: web
    plan: free
    name: wealthhabit-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wealthhabit-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        value: https://yashraool.github.io
      - key: GOOGLE_CLIENT_ID
        sync: false

databases:
  - name: wealthhabit-db
    databaseName: wealthhabit
    user: wealthhabit_user
    plan: free
